# Builds the site and publishes it on GitHub Pages (https://cyberheaven.eu) after every change to main,
# including changes published from the CMS. See docs/hosting.md.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button on the Actions tab, to redeploy by hand

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits for the running one instead of cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
