# Weekly look-outs that open (or update) an issue instead of failing anything: a newer Sveltia, dead links in the
# content, a broken sign-in service. See docs/hosting.md#weekly-look-outs.
name: Weekly

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  sveltia:
    name: New Sveltia version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(grep -oP '@sveltia/cms@\K[\d.]+' public/admin/index.html)
          latest=$(npm view @sveltia/cms version)
          echo "Pinned $pinned, latest $latest"
          [ "$pinned" = "$latest" ] && exit 0
          title="Update Sveltia CMS to $latest (we use $pinned)"
          body="Sveltia CMS $latest is out; \`public/admin/index.html\` loads $pinned.
          What changed: https://github.com/sveltia/sveltia-cms/releases
          How to update and test it (version and integrity hash): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/cms.md#updating-sveltia."
          sh .github/issue.sh "Update Sveltia CMS" "$title" "$body"

  links:
    name: Dead links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-external-links.mjs > links.txt && { cat links.txt; exit 0; }
          cat links.txt
          sh .github/issue.sh "Dead links" "Dead links in the content" "$(cat links.txt)

          Fix each link in the CMS (the article, page or list it's in), or remove it. Close this issue when they're done.
          Only pages that are gone count; sites that refuse automated visits are skipped. How it works: \`scripts/check-external-links.mjs\`."

  signin:
    name: Sign-in service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The tests from docs/cms-login.md: the service refuses other sites, and sends ours on to GitHub
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          W=$(grep -oP '^\s+base_url:\s*\K\S+' public/admin/config.yml)
          refused=$(curl -s -m 30 "$W/auth?provider=github&site_id=evil.example" | grep -c UNSUPPORTED_DOMAIN)
          ours=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$W/auth?provider=github&site_id=cyberheaven.eu")
          echo "$W: other site refused: $refused, ours: $ours"
          [ "$refused" = 1 ] && [ "$ours" = 302 ] && exit 0
          sh .github/issue.sh "Sign-in service" "Sign-in service isn't working" "The weekly test of $W failed (another site refused: $refused, expected 1; ours answered $ours, expected 302).
          Volunteers probably can't sign in to the CMS. What to check: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/cms-login.md"
