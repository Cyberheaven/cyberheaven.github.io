<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CyberHeaven CMS</title>
    <meta name="robots" content="noindex">
  </head>
  <body>
    <!-- integrity: the browser refuses the script if unpkg ever serves different bytes for this version. Change it with
         the version (docs/cms.md "Updating Sveltia" has the command). -->
    <script src="https://unpkg.com/@sveltia/cms@0.253.1/dist/sveltia-cms.js"
      integrity="sha384-YXjq3mkXJGchCcuDN3/22Wn7iy4syPQIe0Ht4Ls+6Mk+BtChdpMaDhMFxWlzvke4" crossorigin="anonymous"></script>
    <!-- CyberHeaven look for the CMS. It must come after the script above: Sveltia adds its own styles
         to <head> when it starts, and later styles win. After updating Sveltia, check theme.css still applies. -->
    <link rel="stylesheet" href="theme.css">
    <!-- Previews that look like the live site (articles and team members) -->
    <script type="module" src="cms.js"></script>
  </body>
</html>
